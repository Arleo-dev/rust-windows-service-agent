[package]
name = "agent-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
sysinfo = "0.39.6"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
winapi = "0.3.9"

[target.'cfg(windows)'.dependencies]
windows-acl = "0.3.0"
windows-service = "0.8.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_UI_Shell",
    "Win32_Foundation"
] }
